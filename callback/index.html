<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tesla sign-in</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#222}
textarea{width:100%;height:110px;font-size:14px;padding:8px;box-sizing:border-box}
button{font-size:18px;padding:12px 20px;margin-top:12px;border-radius:10px;border:0;background:#1a73e8;color:#fff;width:100%}
.err{color:#b00}</style></head>
<body>
<h2>Вход в Tesla выполнен</h2>
<p id="msg">Скопируй строку ниже и отправь её Водиле в чат. Код одноразовый и действует несколько минут.</p>
<textarea id="out" readonly></textarea>
<button id="copy">Скопировать</button>
<script>
var p=new URLSearchParams(location.search);
var code=p.get('code'),state=p.get('state'),err=p.get('error');
var out=document.getElementById('out');
if(err){document.getElementById('msg').className='err';out.value='error='+err+' '+(p.get('error_description')||'');}
else if(code){out.value='code='+code+' state='+(state||'');}
else{out.value='Нет кода в адресе.';}
document.getElementById('copy').onclick=function(){out.select();try{navigator.clipboard.writeText(out.value)}catch(e){document.execCommand('copy')}this.textContent='Скопировано';};
</script>
</body></html>
